name: call-intake-phone
services:
  phone:
    build:
      context: ..
      dockerfile: phone/Dockerfile
    environment:
      SIP_TEST_PASSWORD: ${SIP_TEST_PASSWORD:?phone/.env에 16자 이상 테스트 암호를 입력하세요}
      INBOUND_DID: ${INBOUND_DID:-07000000000}
      PROVIDER_CIDRS: ${PROVIDER_CIDRS:-}
      SIP_BIND_IP: ${SIP_BIND_IP:-127.0.0.1}
      PUBLIC_IP: ${PUBLIC_IP:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      OLLAMA_URL: ${PHONE_OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "${SIP_BIND_IP:-127.0.0.1}:5060:5060/udp"
      - "${SIP_BIND_IP:-127.0.0.1}:18000-18020:18000-18020/udp"
    volumes:
      - voice-models:/models
      - ../runtime/phone:/runtime
      - ../faq.json:/app/faq.json:ro
volumes:
  voice-models:
